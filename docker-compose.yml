volumes:
    prometheus_data: {}
    grafana_data: {}
    mongo_data: {}

networks:
  front-tier:
  back-tier:

services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      prediction_service:
        condition: service_healthy
    environment:
      PREDICTION_SERVICE_URL: "http://prediction_service:9696"
      GRAFANA_URL: "http://localhost:3000"
      PROMETHEUS_URL: "http://localhost:9091"
      EVIDENTLY_URL: "http://localhost:8085/metrics"
    ports:
      - "8501:8501"
    networks:
      - front-tier
    restart: unless-stopped

  prediction_service:
    build:
      context: prediction_service
      dockerfile: Dockerfile
    depends_on:
      - evidently_service
      - mongo
    environment:
      MODEL_SOURCE: "local"
      MODEL_VERSION: "local-clf.bin"
      # Service DNS names on the Compose network. A trailing dot makes the
      # name absolute and Docker's DNS will not resolve it.
      EVIDENTLY_SERVICE: "http://evidently_service:8085"
      MONGODB_ADDRESS: "mongodb://mongo:27017/"
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9696/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - back-tier
      - front-tier

  evidently_service:
    build:
      context: evidently_service
      dockerfile: Dockerfile
    depends_on:
      - grafana
    volumes:
      - ./evidently_service/datasets:/app/datasets
      - ./evidently_service/config.yaml:/app/config.yaml
    ports:
      - "8085:8085"
    networks:
      - back-tier
      - front-tier

  prometheus:
    image: prom/prometheus
    volumes:
      - ./evidently_service/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./evidently_service/config/alert.rules:/etc/prometheus/alert.rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9091:9090"
    networks:
      - back-tier
    restart: always

  grafana:
    image: grafana/grafana
    user: "472"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./evidently_service/config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./evidently_service/config/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./evidently_service/dashboards:/opt/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - back-tier
      - front-tier
    restart: always

  mongo:
    image: mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - back-tier
      - front-tier
